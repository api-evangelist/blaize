aid: blaize
name: Blaize
description: 'Blaize (NASDAQ: BZAI) is an edge AI company headquartered in El Dorado
  Hills, California that builds a programmable inference platform uniting silicon and
  software. Its Graph Streaming Processor (GSP) powers the Pathfinder and Xplorer accelerator
  families — SoM, M.2, EDSFF and PCIe form factors plus the DST developer station and
  Blaize Inference Server — and its software layer pairs the Picasso SDK (C++, Python,
  OpenVX, with TensorFlow/PyTorch/ONNX import via NetDeploy) with AI Studio, a code-free
  environment spanning the full edge AI DataOps/DevOps/MLOps lifecycle. In April 2026
  Blaize announced a planned Blaize AI Services platform that packages multimodal inference,
  business logic and orchestration as modular application-level APIs across vision,
  video, document, speech and moderation workloads. The developer surface — SDK downloads,
  repositories and reference material — is served from a self-hosted GitLab at software.blaize.com
  and requires an account, so no public machine-readable API contract is published.'
